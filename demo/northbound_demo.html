<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORTHBOUND - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            background: #000;
            border: 4px solid #333;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #331100 0%, #663300 50%, #442200 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffcc66;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
        }

        #start-screen h1 {
            font-size: 24px;
            margin-bottom: 40px;
            animation: heat 2s infinite;
        }

        @keyframes heat {
            0%, 100% { text-shadow: 0 0 10px #ff6600; }
            50% { text-shadow: 0 0 20px #ff9900; }
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 50;
        }

        .crt-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
            z-index: 51;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="640" height="480"></canvas>
        <div class="scanlines"></div>
        <div class="crt-effect"></div>
        <div id="start-screen">
            <p style="color: #996633; font-size: 11px; margin-bottom: 20px;">[ 2,000 MILES TO GO ]</p>
            <h1>NORTHBOUND</h1>
            <p style="color: #cc9955; font-size: 12px; margin-top: 20px;">[ CLICK OR PRESS SPACE ]</p>
        </div>
    </div>

    <script>
// ============================================
// NORTHBOUND - 8-BIT DEMO
// ============================================

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('start-screen');

let audioCtx = null;

function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// Journey sounds - hopeful but weary
function playBeep(freq = 440, duration = 0.1, type = 'triangle') {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playSelectBeep() {
    playBeep(520, 0.08);
    setTimeout(() => playBeep(650, 0.1), 80);
}

function playTextBeep() {
    playBeep(200 + Math.random() * 80, 0.025, 'triangle');
}

function playMenuMove() {
    playBeep(300, 0.05);
}

function playRainDrop() {
    playBeep(800 + Math.random() * 400, 0.05, 'sine');
}

function playHopeChord() {
    playBeep(262, 0.4, 'triangle');
    setTimeout(() => playBeep(330, 0.4, 'triangle'), 100);
    setTimeout(() => playBeep(392, 0.5, 'triangle'), 200);
}

// Journey music - steady traveling rhythm
let musicPlaying = false;
let musicInterval = null;

// Mixolydian mode - hopeful but not naive
const bassline = [98, 98, 110, 110, 82, 82, 98, 98]; // G mixolydian feel
const melody = [294, 330, 294, 262, 294, 330, 392, 330];
let noteIndex = 0;

function startMusic() {
    if (musicPlaying || !audioCtx) return;
    musicPlaying = true;

    musicInterval = setInterval(() => {
        if (!musicPlaying) return;

        // Steady bass - like wheels on road
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = 'triangle';
        bassOsc.frequency.value = bassline[noteIndex % bassline.length];
        bassGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        bassGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        bassOsc.connect(bassGain);
        bassGain.connect(audioCtx.destination);
        bassOsc.start();
        bassOsc.stop(audioCtx.currentTime + 0.25);

        // Melody - every other beat
        if (noteIndex % 2 === 0) {
            const melOsc = audioCtx.createOscillator();
            const melGain = audioCtx.createGain();
            melOsc.type = 'triangle';
            melOsc.frequency.value = melody[(noteIndex / 2) % melody.length];
            melGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            melGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            melOsc.connect(melGain);
            melGain.connect(audioCtx.destination);
            melOsc.start();
            melOsc.stop(audioCtx.currentTime + 0.3);
        }

        noteIndex++;
    }, 280);
}

function stopMusic() {
    musicPlaying = false;
    if (musicInterval) clearInterval(musicInterval);
}

// Color palettes that shift as we go north
const COLORS_SOUTH = {
    sky: '#cc6622',
    skyHigh: '#662200',
    ground: '#553311',
    road: '#332211',
    sun: '#ffcc00',
    heat: '#ff6600'
};

const COLORS_MID = {
    sky: '#446688',
    skyHigh: '#223344',
    ground: '#554433',
    road: '#333333',
    clouds: '#667788'
};

const COLORS_NORTH = {
    sky: '#4477aa',
    skyHigh: '#224466',
    ground: '#446644',
    road: '#444444',
    clouds: '#aabbcc',
    rain: '#99aacc'
};

const COLORS = {
    black: '#000000',
    darkGray: '#333333',
    gray: '#666666',
    lightGray: '#999999',
    white: '#cccccc',
    yellow: '#ccaa44',
    orange: '#cc7733',
    red: '#993333',
    green: '#558844',
    darkGreen: '#335522',
    blue: '#446688',
    darkBlue: '#223344',
    brown: '#664422',
    tan: '#aa8866'
};

// Draw school bus
function drawSchoolBus(x, y, scale = 1) {
    const s = scale;
    ctx.fillStyle = '#ccaa22';
    ctx.fillRect(x, y + 4*s, 70*s, 28*s);
    ctx.fillRect(x + 8*s, y, 50*s, 6*s);
    // Windows
    ctx.fillStyle = '#88aacc';
    for (let i = 0; i < 5; i++) {
        ctx.fillRect(x + 10*s + i*12*s, y + 8*s, 8*s, 14*s);
    }
    // Wheels
    ctx.fillStyle = '#222222';
    ctx.fillRect(x + 10*s, y + 32*s, 14*s, 8*s);
    ctx.fillRect(x + 46*s, y + 32*s, 14*s, 8*s);
}

// Draw person
function drawPerson(x, y, color = COLORS.blue, scale = 1) {
    const s = scale;
    ctx.fillStyle = COLORS.tan;
    ctx.fillRect(x + 2*s, y, 4*s, 4*s);
    ctx.fillStyle = color;
    ctx.fillRect(x + 1*s, y + 4*s, 6*s, 8*s);
    ctx.fillStyle = COLORS.darkGray;
    ctx.fillRect(x + 1*s, y + 12*s, 2*s, 4*s);
    ctx.fillRect(x + 5*s, y + 12*s, 2*s, 4*s);
}

// Draw car (generic)
function drawCar(x, y, color = COLORS.gray, scale = 1) {
    const s = scale;
    ctx.fillStyle = color;
    ctx.fillRect(x + 4*s, y + 4*s, 32*s, 12*s);
    ctx.fillRect(x + 10*s, y, 18*s, 6*s);
    ctx.fillStyle = '#88aacc';
    ctx.fillRect(x + 12*s, y + 1*s, 6*s, 4*s);
    ctx.fillRect(x + 20*s, y + 1*s, 6*s, 4*s);
    ctx.fillStyle = '#222222';
    ctx.fillRect(x + 6*s, y + 16*s, 8*s, 5*s);
    ctx.fillRect(x + 26*s, y + 16*s, 8*s, 5*s);
}

// Draw southern desert scene (Texas)
function drawDesertScene(scrollX = 0, heatWave = true) {
    // Harsh sky
    ctx.fillStyle = COLORS_SOUTH.skyHigh;
    ctx.fillRect(0, 0, 640, 100);
    ctx.fillStyle = COLORS_SOUTH.sky;
    ctx.fillRect(0, 100, 640, 100);

    // Brutal sun
    ctx.fillStyle = COLORS_SOUTH.sun;
    ctx.beginPath();
    ctx.arc(520, 80, 40, 0, Math.PI * 2);
    ctx.fill();

    // Heat shimmer
    if (heatWave) {
        ctx.fillStyle = 'rgba(255, 150, 50, 0.1)';
        for (let i = 0; i < 5; i++) {
            const hy = 180 + Math.sin(Date.now() / 200 + i) * 5;
            ctx.fillRect(0, hy + i * 3, 640, 3);
        }
    }

    // Cracked ground
    ctx.fillStyle = COLORS_SOUTH.ground;
    ctx.fillRect(0, 200, 640, 280);

    // Cracks
    ctx.strokeStyle = '#332200';
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.moveTo((i * 100 - scrollX * 0.2) % 800, 200);
        ctx.lineTo((i * 100 + 30 - scrollX * 0.2) % 800, 280);
        ctx.stroke();
    }

    // Road
    ctx.fillStyle = COLORS_SOUTH.road;
    ctx.fillRect(0, 300, 640, 80);

    // Road lines
    ctx.fillStyle = '#665522';
    for (let i = -1; i < 12; i++) {
        const lx = (i * 80 - (scrollX % 80));
        ctx.fillRect(lx, 338, 40, 4);
    }

    // Dead vegetation
    ctx.fillStyle = '#443322';
    for (let i = 0; i < 6; i++) {
        const dx = (i * 150 - scrollX * 0.3 + 900) % 900 - 100;
        ctx.fillRect(dx, 250, 4, 30);
        ctx.fillRect(dx - 8, 260, 8, 3);
        ctx.fillRect(dx + 4, 265, 8, 3);
    }
}

// Draw mid-journey scene (Oklahoma/Kansas)
function drawPlainsScene(scrollX = 0) {
    // Overcast sky
    ctx.fillStyle = COLORS_MID.skyHigh;
    ctx.fillRect(0, 0, 640, 100);
    ctx.fillStyle = COLORS_MID.sky;
    ctx.fillRect(0, 100, 640, 100);

    // Clouds
    ctx.fillStyle = COLORS_MID.clouds;
    for (let i = 0; i < 4; i++) {
        const cx = (i * 200 - scrollX * 0.1 + 800) % 800 - 50;
        ctx.fillRect(cx, 50 + (i % 2) * 30, 100, 30);
        ctx.fillRect(cx + 20, 35 + (i % 2) * 30, 60, 25);
    }

    // Prairie
    ctx.fillStyle = COLORS_MID.ground;
    ctx.fillRect(0, 200, 640, 280);

    // Grass texture
    ctx.fillStyle = '#665544';
    for (let i = 0; i < 30; i++) {
        const gx = (i * 40 - scrollX * 0.4 + 1200) % 1200 - 100;
        ctx.fillRect(gx, 220 + (i % 5) * 15, 2, 8);
    }

    // Road
    ctx.fillStyle = COLORS_MID.road;
    ctx.fillRect(0, 300, 640, 80);

    // Road lines
    ctx.fillStyle = '#888866';
    for (let i = -1; i < 12; i++) {
        const lx = (i * 80 - (scrollX % 80));
        ctx.fillRect(lx, 338, 40, 4);
    }
}

// Draw northern scene (Minnesota)
function drawNorthernScene(scrollX = 0, raining = false) {
    // Clear blue sky
    ctx.fillStyle = COLORS_NORTH.skyHigh;
    ctx.fillRect(0, 0, 640, 100);
    ctx.fillStyle = COLORS_NORTH.sky;
    ctx.fillRect(0, 100, 640, 100);

    // Fluffy clouds
    ctx.fillStyle = COLORS_NORTH.clouds;
    for (let i = 0; i < 5; i++) {
        const cx = (i * 180 - scrollX * 0.1 + 900) % 900 - 100;
        ctx.beginPath();
        ctx.arc(cx + 30, 60 + (i % 2) * 20, 25, 0, Math.PI * 2);
        ctx.arc(cx + 55, 55 + (i % 2) * 20, 30, 0, Math.PI * 2);
        ctx.arc(cx + 85, 60 + (i % 2) * 20, 25, 0, Math.PI * 2);
        ctx.fill();
    }

    // Green land!
    ctx.fillStyle = COLORS_NORTH.ground;
    ctx.fillRect(0, 200, 640, 280);

    // Trees
    ctx.fillStyle = COLORS.darkGreen;
    for (let i = 0; i < 8; i++) {
        const tx = (i * 120 - scrollX * 0.3 + 960) % 960 - 60;
        // Tree trunk
        ctx.fillStyle = '#553322';
        ctx.fillRect(tx + 12, 230, 8, 30);
        // Foliage
        ctx.fillStyle = COLORS.darkGreen;
        ctx.fillRect(tx, 200, 32, 35);
        ctx.fillRect(tx + 6, 190, 20, 15);
    }

    // Road
    ctx.fillStyle = COLORS_NORTH.road;
    ctx.fillRect(0, 300, 640, 80);

    // Road lines
    ctx.fillStyle = '#aaaaaa';
    for (let i = -1; i < 12; i++) {
        const lx = (i * 80 - (scrollX % 80));
        ctx.fillRect(lx, 338, 40, 4);
    }

    // Rain
    if (raining) {
        ctx.fillStyle = COLORS_NORTH.rain;
        for (let i = 0; i < 50; i++) {
            const rx = (i * 47 + scrollX + Date.now() / 10) % 640;
            const ry = (i * 31 + Date.now() / 8) % 400;
            ctx.fillRect(rx, ry, 2, 10);
        }
    }
}

// Draw city ruins (Dallas)
function drawDallasRuins(scrollX = 0) {
    // Empty sky
    ctx.fillStyle = '#334455';
    ctx.fillRect(0, 0, 640, 200);

    // Abandoned skyline
    ctx.fillStyle = '#222233';
    const buildings = [
        { x: 50, w: 60, h: 120 },
        { x: 130, w: 80, h: 180 },
        { x: 230, w: 50, h: 100 },
        { x: 300, w: 100, h: 200 },
        { x: 420, w: 70, h: 150 },
        { x: 510, w: 90, h: 170 }
    ];

    buildings.forEach(b => {
        ctx.fillStyle = '#222233';
        ctx.fillRect(b.x - scrollX * 0.1, 200 - b.h, b.w, b.h);
        // Dark windows - no lights
        ctx.fillStyle = '#111122';
        for (let wy = 210 - b.h; wy < 190; wy += 15) {
            for (let wx = b.x + 5 - scrollX * 0.1; wx < b.x + b.w - 10 - scrollX * 0.1; wx += 12) {
                ctx.fillRect(wx, wy, 8, 10);
            }
        }
    });

    // Ground
    ctx.fillStyle = '#333344';
    ctx.fillRect(0, 200, 640, 280);

    // Abandoned cars on street
    ctx.fillStyle = '#333333';
    for (let i = 0; i < 5; i++) {
        ctx.fillRect(100 + i * 120, 320, 40, 20);
    }

    // Open doors
    ctx.fillStyle = '#444444';
    ctx.fillRect(135, 315, 15, 5);
    ctx.fillRect(255, 315, 15, 5);
}

// Draw sinkhole scene
function drawSinkholeScene() {
    // Ominous sky
    ctx.fillStyle = '#223322';
    ctx.fillRect(0, 0, 640, 200);

    // Grass that hides danger
    ctx.fillStyle = '#334422';
    ctx.fillRect(0, 200, 640, 280);

    // The sinkhole
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(320, 320, 120, 60, 0, 0, Math.PI * 2);
    ctx.fill();

    // Crumbling edge
    ctx.fillStyle = '#221100';
    ctx.beginPath();
    ctx.ellipse(320, 320, 140, 70, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#334422';
    ctx.beginPath();
    ctx.ellipse(320, 320, 120, 60, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(320, 320, 100, 50, 0, 0, Math.PI * 2);
    ctx.fill();

    // Vehicle in hole (the ones who didn't make it)
    ctx.fillStyle = '#333333';
    ctx.fillRect(290, 330, 30, 15);
    ctx.fillRect(320, 340, 25, 12);
}

// Draw town (Willmar)
function drawTown() {
    // Nice sky
    ctx.fillStyle = '#5588bb';
    ctx.fillRect(0, 0, 640, 200);

    // Clouds
    ctx.fillStyle = '#aaccee';
    ctx.beginPath();
    ctx.arc(100, 60, 30, 0, Math.PI * 2);
    ctx.arc(130, 50, 35, 0, Math.PI * 2);
    ctx.arc(165, 60, 28, 0, Math.PI * 2);
    ctx.fill();

    // Buildings - alive, with lights
    ctx.fillStyle = '#554433';
    ctx.fillRect(80, 150, 80, 80);
    ctx.fillStyle = '#665544';
    ctx.fillRect(200, 130, 100, 100);
    ctx.fillStyle = '#554444';
    ctx.fillRect(340, 160, 70, 70);
    ctx.fillStyle = '#445544';
    ctx.fillRect(450, 140, 90, 90);

    // Lit windows!
    ctx.fillStyle = '#ffdd88';
    [
        [95, 165], [130, 165], [95, 195], [130, 195],
        [220, 150], [260, 150], [220, 180], [260, 180],
        [355, 175], [390, 175],
        [470, 160], [510, 160], [470, 190], [510, 190]
    ].forEach(([wx, wy]) => {
        ctx.fillRect(wx, wy, 15, 12);
    });

    // Green grass
    ctx.fillStyle = '#447744';
    ctx.fillRect(0, 230, 640, 250);

    // Road into town
    ctx.fillStyle = '#444444';
    ctx.fillRect(200, 300, 240, 180);
}

// Text box
function drawTextBox(text, speaker = null) {
    ctx.fillStyle = 'rgba(20, 30, 25, 0.95)';
    ctx.fillRect(20, 380, 600, 90);

    ctx.strokeStyle = '#88aa88';
    ctx.lineWidth = 2;
    ctx.strokeRect(20, 380, 600, 90);
    ctx.strokeStyle = '#557755';
    ctx.strokeRect(24, 384, 592, 82);

    if (speaker) {
        ctx.fillStyle = '#000';
        ctx.fillRect(30, 372, speaker.length * 10 + 20, 16);
        ctx.fillStyle = '#88cc88';
        ctx.font = '14px monospace';
        ctx.fillText(speaker, 40, 385);
    }

    ctx.fillStyle = '#ccddcc';
    ctx.font = '14px monospace';
    const lines = text.split('\n');
    lines.forEach((line, i) => {
        ctx.fillText(line, 40, 410 + i * 20);
    });
}

// Menu
function drawMenu(options, selectedIndex, title = null) {
    const menuWidth = 360;
    const menuHeight = options.length * 30 + 40;
    const menuX = (640 - menuWidth) / 2;
    const menuY = (480 - menuHeight) / 2;

    ctx.fillStyle = 'rgba(15, 25, 20, 0.95)';
    ctx.fillRect(menuX, menuY, menuWidth, menuHeight);

    ctx.strokeStyle = '#88aa88';
    ctx.lineWidth = 2;
    ctx.strokeRect(menuX, menuY, menuWidth, menuHeight);

    if (title) {
        ctx.fillStyle = '#88cc88';
        ctx.font = '14px monospace';
        ctx.fillText(title, menuX + 20, menuY + 25);
    }

    options.forEach((opt, i) => {
        const optY = menuY + 50 + i * 30;
        if (i === selectedIndex) {
            ctx.fillStyle = '#88cc88';
            ctx.fillText('>', menuX + 20, optY);
            ctx.fillStyle = '#ccddcc';
        } else {
            ctx.fillStyle = '#667766';
        }
        ctx.font = '14px monospace';
        ctx.fillText(opt, menuX + 40, optY);
    });
}

// Mileage counter
function drawMileage(miles, total = 2000) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(10, 10, 150, 30);
    ctx.strokeStyle = '#557755';
    ctx.strokeRect(10, 10, 150, 30);

    ctx.fillStyle = '#88aa88';
    ctx.font = '12px monospace';
    ctx.fillText(`MILE ${miles} / ${total}`, 25, 30);

    // Progress bar
    ctx.fillStyle = '#333';
    ctx.fillRect(170, 15, 100, 20);
    ctx.fillStyle = '#5a5';
    ctx.fillRect(170, 15, (miles / total) * 100, 20);
}

// Scenes
const scenes = [
    // TITLE
    {
        type: 'title',
        duration: 5000,
        draw: (progress) => {
            // Heat gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, 480);
            gradient.addColorStop(0, '#662200');
            gradient.addColorStop(0.5, '#cc4400');
            gradient.addColorStop(1, '#331100');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 640, 480);

            // Sun
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(320, 400 - progress * 50, 60, 0, Math.PI * 2);
            ctx.fill();

            // Heat waves
            ctx.strokeStyle = 'rgba(255, 200, 100, 0.3)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 300 + i * 20);
                for (let x = 0; x < 640; x += 20) {
                    ctx.lineTo(x, 300 + i * 20 + Math.sin(x * 0.05 + progress * 10 + i) * 5);
                }
                ctx.stroke();
            }

            ctx.fillStyle = '#ffcc66';
            ctx.font = '48px monospace';
            ctx.fillText('NORTHBOUND', 140, 180);

            ctx.fillStyle = '#cc9944';
            ctx.font = '14px monospace';
            ctx.fillText('2,000 miles to salvation', 220, 230);

            if (progress > 0.5) {
                ctx.fillStyle = '#996633';
                ctx.font = '12px monospace';
                ctx.fillText('LAREDO, TEXAS - THE LAST SUMMER', 200, 350);
            }
        }
    },

    // INTRO - THE HEAT
    {
        type: 'scene',
        duration: 6000,
        speaker: 'NARRATOR',
        text: 'The heat came first. Then the crops died.\nThen the aquifers went dry.\nSouth Texas became unlivable in a single summer.',
        draw: (progress, scrollX) => {
            drawDesertScene(scrollX, true);

            // Dead crops
            ctx.fillStyle = '#443322';
            for (let i = 0; i < 10; i++) {
                ctx.fillRect(100 + i * 50, 240, 3, 20);
            }

            // Cracked earth detail
            ctx.strokeStyle = '#221100';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(200, 250);
            ctx.lineTo(220, 280);
            ctx.lineTo(200, 290);
            ctx.stroke();
        }
    },

    // MARIA SANTOS
    {
        type: 'scene',
        duration: 5000,
        speaker: 'NARRATOR',
        text: 'Maria Santos was a high school principal.\nWhen the last water truck did not come,\nshe took the school\'s two buses.',
        draw: (progress) => {
            // School
            ctx.fillStyle = '#553322';
            ctx.fillRect(0, 0, 640, 480);

            // School building
            ctx.fillStyle = '#664433';
            ctx.fillRect(150, 100, 340, 180);

            // SCHOOL text

            });

            // Safe path (dotted)
            ctx.strokeStyle = '#88aa88';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 5]);
            ctx.beginPath();
            ctx.moveTo(50, 450);
            ctx.bezierCurveTo(100, 350, 250, 380, 280, 250);
            ctx.bezierCurveTo(310, 150, 380, 200, 450, 100);
            ctx.bezierCurveTo(500, 50, 550, 80, 600, 50);
            ctx.stroke();
            ctx.setLineDash([]);

            // Scout ahead
            ctx.fillStyle = '#ffcc44';
            const scoutPos = progress;
            ctx.beginPath();
            ctx.arc(50 + scoutPos * 550, 450 - scoutPos * 400, 8, 0, Math.PI * 2);

        draw: (progress) => {

            ctx.fillRect(280, 230, 20, 18);
            ctx.fillRect(375, 240, 18, 16);
            ctx.fillRect(410, 240, 18, 16);
            ctx.fillRect(500, 235, 20, 18);
            ctx.fillRect(540, 235, 20, 18);

            // Smoke from chimneys

    {

    // TITLE END
    {
        type: 'title',
        duration: 10000,
        draw: (progress) => {
            // Gradient from heat to cool

            gradient.addColorStop(0, '#224466');
            gradient.addColorStop(0.5, '#446655');
            gradient.addColorStop(1, '#223322');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 640, 480);

            ctx.fillStyle = '#aaccaa';
            ctx.font = '36px monospace';

            ctx.fillStyle = '#88aa88';
            ctx.font = '12px monospace';
            ctx.fillText('"We are not running to safety.', 210, 160);
            ctx.fillText('We are running to time."', 230, 180);

            if (progress > 0.2) {
                ctx.fillStyle = '#669966';
                ctx.font = '11px monospace';
                ctx.fillText('Maria Santos - The principal who led them', 50, 250);
                ctx.fillText('Garrett - The geologist seeking redemption', 50, 270);
                ctx.fillText('Dr. Simone Adler - The scientist with hard truths', 50, 290);
                ctx.fillText('Hector - 15 years keeping buses alive', 50, 310);
                ctx.fillText('David - Patricia\'s son, carrying goodbye', 50, 330);
            }

            if (progress > 0.4) {
                ctx.fillStyle = '#557755';

            if (progress > 0.88) {
                ctx.fillStyle = '#88cc88';
                ctx.fillText('Press R to replay', 270, 460);
            }

    }
];

// Game state
let currentScene = 0;
let sceneStartTime = 0;
let scrollX = 0;
let gameStarted = false;
let menuSelection = 0;
let selectionMade = false;

function gameLoop(timestamp) {
    if (!gameStarted) {
        requestAnimationFrame(gameLoop);
        return;
    }

    const scene = scenes[currentScene];
    const elapsed = timestamp - sceneStartTime;
    const progress = Math.min(elapsed / scene.duration, 1);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 640, 480);

    scrollX += 2;

    scene.draw(progress, scrollX);

    if (scene.type === 'scene' && scene.text) {
        drawTextBox(scene.text, scene.speaker);
    }

    if (scene.type === 'menu') {
        drawMenu(scene.options, menuSelection, scene.title);

        if (!selectionMade && scene.selectDelay && elapsed > scene.selectDelay) {
            if (menuSelection < scene.autoSelect) {
                menuSelection++;
                playMenuMove();
            } else if (menuSelection > scene.autoSelect) {
                menuSelection--;
                playMenuMove();
            } else {
                selectionMade = true;
                playSelectBeep();
            }
        } else if (!selectionMade && !scene.selectDelay) {
            menuSelection = scene.autoSelect || 0;
        }
    }

    if (scene.type === 'scene' && Math.random() > 0.88) {
        playTextBeep();
    }

    if (progress >= 1) {
        currentScene++;
        sceneStartTime = timestamp;
        menuSelection = 0;
        selectionMade = false;

        if (currentScene >= scenes.length) {
            currentScene = scenes.length - 1;
            stopMusic();
        }
    }

    requestAnimationFrame(gameLoop);
}

function startGame() {
    if (gameStarted) return;
    initAudio();
    gameStarted = true;
    sceneStartTime = performance.now();
    startScreen.style.display = 'none';
    startMusic();
}

document.addEventListener('keydown', (e) => {
    if (!gameStarted) {
        startGame();
    }
    if (e.key === 'r' || e.key === 'R') {
        currentScene = 0;
        sceneStartTime = performance.now();
        noteIndex = 0;
        startMusic();
    }
});

startScreen.addEventListener('click', startGame);

requestAnimationFrame(gameLoop);
    </script>
